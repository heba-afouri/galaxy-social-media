{% extends "posts/post_base.html" %}
{% load bootstrap4 %}

{% block title %}New Post — Star Social{% endblock %}

{% block post_body %}
<div class="center-wrap" style="min-height: 50vh;">
    <div class="space-card" style="width: 100%; max-width: 560px; padding: 36px;">
        <h2 class="heading text-gradient text-center mb-3">Share Cosmic Thoughts</h2>
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-cyber btn-block mt-2">
                <i class="fas fa-rocket"></i> Launch Post
            </button>
        </form>
    </div>
</div>
{% endblock %}
