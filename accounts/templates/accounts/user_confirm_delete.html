{% extends "base.html" %}

{% block title %}Delete Account — Star Social{% endblock %}

{% block content %}
<div class="container center-wrap">
    <div class="space-card text-center" style="width: 100%; max-width: 480px; padding: 36px;">
        <i class="fas fa-user-slash text-danger" style="font-size: 2rem;"></i>
        <h3 class="heading text-danger mt-2 mb-2">Delete Account?</h3>
        <p class="text-muted mb-3">
            This permanently deletes your account, your posts, and any galaxies you own.
            This action cannot be undone.
        </p>
        <form method="POST" class="flex items-center gap-sm" style="justify-content: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash-alt"></i> Yes, Delete My Account
            </button>
            <a href="{% url 'posts:for_user' username=user.username %}" class="btn btn-ghost">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
