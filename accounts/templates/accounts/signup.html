{% extends "base.html" %}
{% load bootstrap4 %}

{% block title %}Sign up — Star Social{% endblock %}

{% block content %}
<div class="container center-wrap">
    <div class="space-card" style="width: 100%; max-width: 460px; padding: 40px;">

        <h2 class="heading text-gradient text-center mb-3" style="font-size: 1.7rem;">
            Create Account
        </h2>

        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-cyber btn-block mt-2">
                <i class="fas fa-user-plus"></i> Sign Up
            </button>
        </form>

        <p class="text-center text-dim mt-3" style="font-size: 0.85rem;">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="text-magenta" style="font-weight: 600;">Login</a>
        </p>

    </div>
</div>
{% endblock %}
