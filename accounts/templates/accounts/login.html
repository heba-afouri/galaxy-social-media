{% extends "base.html" %}
{% load bootstrap4 %}

{% block title %}Log in — Star Social{% endblock %}

{% block content %}
<div class="container center-wrap">
    <div class="space-card" style="width: 100%; max-width: 440px; padding: 40px;">

        <h2 class="heading text-gradient text-center mb-3" style="font-size: 1.7rem;">
            Login to Star Social
        </h2>

        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form show_help=False %}
            <button type="submit" class="btn btn-cyber btn-block mt-2">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <p class="text-center text-dim mt-3" style="font-size: 0.85rem;">
            Don't have an account?
            <a href="{% url 'accounts:signup' %}" class="text-magenta" style="font-weight: 600;">Sign Up</a>
        </p>

    </div>
</div>
{% endblock %}
