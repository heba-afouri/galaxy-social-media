{% extends "groups/group_base.html" %}

{% block title %}Delete {{ group.name }} — Star Social{% endblock %}

{% block pregroup %}
<div class="center-wrap" style="min-height: 50vh;">
    <div class="space-card text-center" style="width: 100%; max-width: 480px; padding: 36px;">
        <i class="fas fa-triangle-exclamation text-danger" style="font-size: 2rem;"></i>
        <h3 class="heading text-danger mt-2 mb-2">Delete Galaxy?</h3>
        <p class="text-muted mb-3">
            Delete <strong class="text-white">{{ group.name }}</strong> and all of its transmissions?
            This action cannot be undone.
        </p>
        <form method="POST" class="flex items-center gap-sm" style="justify-content: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Yes, Delete</button>
            <a href="{% url 'groups:single' slug=group.slug %}" class="btn btn-ghost">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
